      <section class="login">
        <h3>Guest login</h3>
        <form id="lg" onsubmit="event.preventDefault();var o=this.querySelector('.otp');if(o.disabled){o.disabled=false;o.focus();document.getElementById('lg-msg').hidden=false}">
          <label>Email<input class="in" type="email" autocomplete="email"></label>
          <div class="pwrow">
            <label>Password<input class="in" type="password" autocomplete="current-password"></label>
            <label title="Asked after your password, only if your account has 2FA">2FA<input class="in otp" type="text" disabled inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="2FA code, if turned on"></label>
          </div>
          <p class="hint" id="lg-msg" role="status" hidden>This account has 2FA. Type the 6-digit code from your app.</p>
          <div class="row"><button class="btn main" type="submit">Log in</button><a href="#">Forgot password?</a></div>
        </form>
        <p class="new">New to OpenHotel?<br><a href="#">Register for free</a> &gt;&gt;</p>
      </section>
